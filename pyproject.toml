[project]
name = "onrecord"
version = "0.1.0"
description = "From-scratch search engine + RAG over public AI-infrastructure records."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "msgpack>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onrecord"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff covers ALL Python: onrecord/, tests/, scripts/. Frozen tests ship
# ruff-clean (orchestrator normalizes pre-freeze — see .tdd-swarm/LESSONS.md);
# excluding tests from lint gates is a gate-weakening anti-pattern. Markdown
# and non-code dirs are excluded because ruff (>=0.16) formats fenced
# ```python blocks inside .md, which would rewrite frozen ticket specs.
extend-exclude = ["tickets", "docs", ".tdd-swarm", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
