# corpus/registry.yaml
#
# Single source of truth for onrecord's corpus adapters (design spec Sec 2.2).
# Adding scale = adding registry lines, never code.
#
# youtube_channels: T1 county/city meeting channels (yt-dlp captions). `id` is
#   the best-known official YouTube handle/URL for the channel; yt-dlp resolves
#   handles/URLs directly, so exact channel IDs are not required. Entries with
#   `verified: false` are best-guess handles that have not been confirmed
#   against the live channel yet -- an honest placeholder, not a fabricated
#   certainty. Verify (and flip to `verified: true`) before an ingest adapter
#   depends on one in anger.
# tickers: T2 earnings-call universe, grouped by sector (design spec Sec 2.2).
# docket_sources: T3 regulatory dockets + FERC + RTO interconnection queues.

